    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document

    setStatus('Unpacking ' + uuids.length + ' assets...');

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

n<script type=\"module\">\n// Standalone build: three.js is inlined by the bundler.\nconst THREE = await import(window.__resources.threeJs);\n\n// ======================================================\n// Prime Ledger palette\n// ======================================================\nconst COL = {\n  navy:      new THREE.Color('#081F34'),\n  navyDeep:  new THREE.Color('#060e1a'),\n  teal:      new THREE.Color('#0388A6'),\n  tealDeep:  new THREE.Color('#026C85'),\n  tealLight: new THREE.Color('#B3DDE8'),\n  bone:      new THREE.Color('#E1DFD9'),\n  white:     new THREE.Color('#FFFFFF'),\n  mid:       new THREE.Color('#6b8a9e'),\n};\n\n// ======================================================\n// Setup renderer + scene\n// ======================================================\nconst canvas = document.getElementById('globe');\nconst labelsLayer = document.getElementById('labels');\n\nconst renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\nrenderer.setSize(window.innerWidth, window.innerHeight);\nrenderer.setClearColor(0xffffff, 0);\n\nconst scene = new THREE.Scene();\n\nconst camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);\ncamera.position.set(0, 0, 4.6);\ncamera.lookAt(0, 0, 0);\n\n// Globe group (so we can rotate it)\nconst globe = new THREE.Group();\nglobe.rotation.z = 0.30;   // slight axial tilt\nscene.add(globe);\n\n// ======================================================\n// Build land mask from a procedural world-map texture\n//\n// We don't have a network-loadable equirectangular land map\n// (project sandbox is offline-ish), so we paint a coarse\n// approximation of continents into a 2D canvas using polygons\n// in equirectangular (lon -180..180, lat -90..90) space.\n// ======================================================\nconst MASK_W = 1024, MASK_H = 512;\nconst maskCanvas = document.createElement('canvas');\nmaskCanvas.width = MASK_W; maskCanvas.height = MASK_H;\nconst mctx = maskCanvas.getContext('2d');\nmctx.fillStyle = '#000';\nmctx.fillRect(0, 0, MASK_W, MASK_H);\nmctx.fillStyle = '#fff';\n\n// Helper: lon/lat -> canvas px\nconst lonLatToPx = (lon, lat) => [\n  ((lon + 180) / 360) * MASK_W,\n  ((90 - lat) / 180) * MASK_H\n];\n\n// Polygon helper (lon/lat array)\nfunction poly(points) {\n  mctx.beginPath();\n  points.forEach((p, i) => {\n    const [x, y] = lonLatToPx(p[0], p[1]);\n    if (i === 0) mctx.moveTo(x, y); else mctx.lineTo(x, y);\n  });\n  mctx.closePath();\n  mctx.fill();\n}\n\n// Coarse continent silhouettes — enough for a recognisable\n// dot-globe. Coordinates are [lon, lat].\n// North America\npoly([\n  [-168,66],[-140,70],[-120,72],[-95,79],[-75,76],[-60,60],[-52,48],\n  [-58,46],[-65,44],[-70,41],[-75,36],[-78,32],[-82,28],[-80,25],\n  [-83,24],[-90,22],[-97,22],[-105,20],[-110,23],[-114,28],[-117,32],\n  [-120,34],[-122,37],[-124,42],[-125,48],[-130,54],[-135,58],[-145,60],\n  [-155,58],[-162,60],[-168,66]\n]);\n// Central America\npoly([\n  [-92,17],[-87,15],[-83,13],[-80,9],[-77,8],[-83,8],[-86,11],[-90,13],[-94,15],[-92,17]\n]);\n// South America\npoly([\n  [-78,11],[-72,11],[-62,9],[-55,5],[-50,0],[-45,-2],[-38,-7],[-35,-12],\n  [-39,-18],[-44,-23],[-49,-29],[-54,-34],[-58,-38],[-65,-42],[-71,-50],\n  [-73,-54],[-70,-54],[-68,-50],[-71,-44],[-72,-38],[-71,-32],[-71,-28],\n  [-72,-22],[-75,-17],[-78,-10],[-80,-5],[-80,0],[-78,4],[-78,11]\n]);\n// Greenland\npoly([\n  [-50,82],[-22,82],[-15,75],[-22,68],[-38,62],[-48,60],[-54,68],[-50,82]\n]);\n// Europe (rough)\npoly([\n  [-9,44],[-2,43],[3,43],[7,44],[12,45],[18,45],[28,46],[40,46],\n  [45,47],[50,55],[42,60],[30,62],[25,65],[20,68],[10,68],[5,62],\n  [-2,58],[-6,55],[-10,52],[-10,48],[-9,44]\n]);\n// UK + Ireland\npoly([[-10,55],[-3,58],[1,55],[1,50],[-5,50],[-9,52],[-10,55]]);\n// Africa\npoly([\n  [-17,21],[-10,28],[0,32],[10,33],[20,32],[28,32],[34,30],[36,22],\n  [40,18],[44,12],[50,11],[51,3],[42,-2],[40,-10],[38,-18],[35,-24],\n  [32,-30],[25,-34],[20,-35],[18,-32],[14,-22],[12,-12],[8,-2],\n  [10,4],[8,8],[2,6],[-5,8],[-10,11],[-15,14],[-17,21]\n]);\n// Madagascar\npoly([[44,-12],[50,-15],[50,-22],[46,-25],[44,-22],[44,-12]]);\n// Middle East / Arabia is part of Africa polygon area, plus:\npoly([\n  [35,12],[42,13],[50,15],[55,22],[58,24],[55,28],[48,30],[42,30],\n  [38,28],[35,22],[35,12]\n]);\n// Asia (massive)\npoly([\n  [40,38],[50,40],[60,42],[70,40],[80,42],[90,45],[100,42],[110,40],\n  [120,38],[130,40],[140,45],[145,55],[150,60],[160,68],[170,70],\n  [175,72],[170,75],[150,76],[130,74],[110,72],[90,72],[70,72],\n  [60,70],[50,68],[42,65],[38,60],[40,55],[42,50],[42,45],[40,38]\n]);\n// India\npoly([\n  [70,30],[78,32],[88,28],[92,24],[90,22],[88,20],[82,15],[78,10],\n  [76,8],[72,15],[70,22],[70,30]\n]);\n// SE Asia / Indochina\npoly([\n  [95,28],[100,28],[107,25],[110,20],[108,12],[105,8],[100,6],[97,12],[95,20],[95,28]\n]);\n// China east coast bulge already captured. Add Japan\npoly([[135,42],[143,44],[145,40],[140,35],[137,36],[135,38],[135,42]]);\n// Indonesia / Philippines (sprinkle)\npoly([[95,5],[105,5],[115,3],[120,0],[115,-3],[105,-6],[100,-2],[95,2],[95,5]]);\npoly([[120,-3],[130,-3],[138,-4],[140,-8],[130,-9],[120,-8],[118,-6],[120,-3]]);\npoly([[120,5],[126,8],[126,14],[122,16],[120,12],[120,5]]);\n// Australia\npoly([\n  [113,-22],[122,-18],[130,-12],[138,-12],[145,-15],[150,-22],\n  [153,-28],[150,-37],[145,-39],[140,-38],[130,-32],[120,-34],\n  [115,-32],[113,-25],[113,-22]\n]);\n// New Zealand\npoly([[166,-46],[172,-41],[174,-37],[178,-39],[176,-44],[170,-47],[166,-46]]);\n\n// Read mask data\nconst maskData = mctx.getImageData(0, 0, MASK_W, MASK_H).data;\n\nfunction isLand(lon, lat) {\n  const x = Math.floor(((lon + 180) / 360) * MASK_W) % MASK_W;\n  const y = Math.floor(((90 - lat) / 180) * MASK_H);\n  if (y < 0 || y >= MASK_H) return false;\n  const idx = (y * MASK_W + x) * 4;\n  return maskData[idx] > 128;\n}\n\n// ======================================================\n// Build globe dots (Fibonacci sphere; keep land points)\n// ======================================================\nconst RADIUS = 1.0;\nconst N = 22000; // total candidate points on sphere\nconst goldenAngle = Math.PI * (3 - Math.sqrt(5));\n\nconst positions = [];\nconst colors = [];\nconst sizes = [];\nconst baseSizes = [];\nconst phases = [];\nconst pulseAmt = [];\n\n// Map longitude (and a bit of latitude) -> Prime Ledger color\n// Left side (west/Americas) → deep navy/teal-deep\n// Center (Atlantic/Europe/Africa) → teal\n// Right side (Asia/Pacific) → teal-light\nfunction colorForLonLat(lon, lat) {\n  // normalize lon to 0..1\n  const t = (lon + 180) / 360;\n  const c = new THREE.Color();\n\n  // 4-stop gradient: navy (0) -> teal-deep (0.33) -> teal (0.66) -> teal-light (1)\n  const stops = [\n    { t: 0.00, c: COL.navy.clone() },\n    { t: 0.30, c: COL.tealDeep.clone() },\n    { t: 0.62, c: COL.teal.clone() },\n    { t: 1.00, c: COL.tealLight.clone() },\n  ];\n  let a = stops[0], b = stops[stops.length - 1];\n  for (let i = 0; i < stops.length - 1; i++) {\n    if (t >= stops[i].t && t <= stops[i+1].t) { a = stops[i]; b = stops[i+1]; break; }\n  }\n  const localT = (t - a.t) / (b.t - a.t || 1);\n  c.copy(a.c).lerp(b.c, localT);\n\n  // Slight latitude darkening near poles for depth\n  const polar = Math.abs(lat) / 90;\n  c.lerp(COL.navy, polar * 0.15);\n\n  return c;\n}\n\nfor (let i = 0; i < N; i++) {\n  const y = 1 - (i / (N - 1)) * 2;          // -1..1\n  const r = Math.sqrt(1 - y * y);\n  const theta = goldenAngle * i;\n  const x = Math.cos(theta) * r;\n  const z = Math.sin(theta) * r;\n\n  // lat/lon\n  const lat = Math.asin(y) * 180 / Math.PI;\n  const lon = Math.atan2(z, x) * 180 / Math.PI;\n\n  if (!isLand(lon, lat)) continue;\n\n  positions.push(x * RADIUS, y * RADIUS, z * RADIUS);\n  const c = colorForLonLat(lon, lat);\n  colors.push(c.r, c.g, c.b);\n  const s = 0.013 + Math.random() * 0.010;\n  sizes.push(s);\n  baseSizes.push(s);\n  phases.push(Math.random() * Math.PI * 2);\n  pulseAmt.push(Math.random() < 0.08 ? 1 : 0); // ~8% of dots will pulse\n}\n\nconst dotGeom = new THREE.BufferGeometry();\ndotGeom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));\ndotGeom.setAttribute('color',    new THREE.Float32BufferAttribute(colors, 3));\nconst sizeAttr = new THREE.Float32BufferAttribute(sizes, 1);\ndotGeom.setAttribute('size', sizeAttr);\n\n// Custom shader so dots are circular + size attenuates by depth\nconst dotMat = new THREE.ShaderMaterial({\n  vertexColors: true,\n  transparent: true,\n  depthWrite: false,\n  uniforms: {\n    uPxRatio: { value: renderer.getPixelRatio() },\n    uViewportH: { value: window.innerHeight }\n  },\n  vertexShader: `\n    attribute float size;\n    varying vec3 vColor;\n    varying float vDepth;\n    uniform float uPxRatio;\n    uniform float uViewportH;\n    void main() {\n      vColor = color;\n      vec4 mv = modelViewMatrix * vec4(position, 1.0);\n      vDepth = -mv.z;\n      gl_Position = projectionMatrix * mv;\n      // size in world units → px (perspective)\n      gl_PointSize = size * (uViewportH / 2.0) * (1.0 / vDepth) * uPxRatio;\n    }\n  `,\n  fragmentShader: `\n    varying vec3 vColor;\n    varying float vDepth;\n    void main() {\n      vec2 uv = gl_PointCoord - 0.5;\n      float d = length(uv);\n      if (d > 0.5) discard;\n      float edge = smoothstep(0.5, 0.35, d);\n      // Slight fade for far side of globe to add depth\n      float depthFade = smoothstep(5.0, 3.4, vDepth);\n      // back-side dots feel softer\n      gl_FragColor = vec4(vColor, edge * mix(0.35, 1.0, depthFade));\n    }\n  `\n});\n\nconst dots = new THREE.Points(dotGeom, dotMat);\nglobe.add(dots);\n\n// ======================================================\n// Faint sphere \"shadow\" — adds subtle volume without\n// breaking the white background\n// ======================================================\nconst sphereGeom = new THREE.SphereGeometry(0.985, 64, 64);\nconst sphereMat = new THREE.MeshBasicMaterial({\n  color: 0xffffff, transparent: true, opacity: 0.0\n});\nconst sphere = new THREE.Mesh(sphereGeom, sphereMat);\nglobe.add(sphere);\n\n// Soft outer glow ring (very subtle teal halo)\nconst ringGeom = new THREE.SphereGeometry(1.04, 64, 64);\nconst ringMat = new THREE.ShaderMaterial({\n  transparent: true,\n  side: THREE.BackSide,\n  depthWrite: false,\n  uniforms: {\n    uColor: { value: new THREE.Color('#0388A6') },\n  },\n  vertexShader: `\n    varying vec3 vN;\n    void main() {\n      vN = normalize(normalMatrix * normal);\n      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);\n    }\n  `,\n  fragmentShader: `\n    varying vec3 vN;\n    uniform vec3 uColor;\n    void main() {\n      float rim = pow(1.0 - abs(vN.z), 2.5);\n      gl_FragColor = vec4(uColor, rim * 0.10);\n    }\n  `\n});\nconst halo = new THREE.Mesh(ringGeom, ringMat);\nglobe.add(halo);\n\n// ======================================================\n// Investment transfer arcs\n// ======================================================\nconst cities = [\n  { name: '0xA52f…0Bc6', lon: -74.0,  lat:  40.7 },\n  { name: '0x8E33…4Fd9', lon: -122.4, lat:  37.8 },\n  { name: '0x2dF7…B617', lon: -87.6,  lat:  41.9 },\n  { name: '0xF019…3aC2', lon: -79.4,  lat:  43.7 },\n  { name: '0x5b94…D8e0', lon: -99.1,  lat:  19.4 },\n  { name: '0xCb27…61F4', lon: -46.6,  lat: -23.5 },\n  { name: '0x0aD6…7E5b', lon: -58.4,  lat: -34.6 },\n  { name: '0xE7C1…2904', lon:  -0.13, lat:  51.5 },\n  { name: '0x3F8b…Ac15', lon:   2.35, lat:  48.86 },\n  { name: '0x94e2…5D7a', lon:   8.68, lat:  50.11 },\n  { name: '0xA52f…0Bc6', lon:   8.55, lat:  47.37 },\n  { name: '0x8E33…4Fd9', lon:   4.90, lat:  52.37 },\n  { name: '0x2dF7…B617', lon:  55.27, lat:  25.20 },\n  { name: '0xF019…3aC2', lon:  28.04, lat: -26.20 },\n  { name: '0x5b94…D8e0', lon:  72.83, lat:  19.07 },\n  { name: '0xCb27…61F4', lon: 103.82, lat:   1.35 },\n  { name: '0x0aD6…7E5b', lon: 114.17, lat:  22.32 },\n  { name: '0xE7C1…2904', lon: 121.47, lat:  31.23 },\n  { name: '0x3F8b…Ac15', lon: 139.69, lat:  35.69 },\n  { name: '0x94e2…5D7a', lon: 126.98, lat:  37.57 },\n  { name: '0xA52f…0Bc6', lon: 151.21, lat: -33.87 },\n];\n\nfunction lonLatToVec3(lon, lat, r = 1) {\n  const phi = (90 - lat) * Math.PI / 180;\n  const theta = (lon + 180) * Math.PI / 180;\n  return new THREE.Vector3(\n    -r * Math.sin(phi) * Math.cos(theta),\n     r * Math.cos(phi),\n     r * Math.sin(phi) * Math.sin(theta)\n  );\n}\n\nfunction pickAmount() {\n  const buckets = [\n    { min: 25,  max: 75,  unit: 'K' },\n    { min: 80,  max: 250, unit: 'K' },\n    { min: 300, max: 950, unit: 'K' },\n    { min: 1,   max: 9,   unit: 'M' },  // 1M – 9M (dec)\n    { min: 10,  max: 75,  unit: 'M' },  // 10M – 75M\n  ];\n  const w = [25, 30, 25, 14, 6];\n  const total = w.reduce((a,b)=>a+b, 0);\n  let r = Math.random() * total;\n  let i = 0;\n  while (r > w[i]) { r -= w[i]; i++; }\n  const b = buckets[i];\n  if (b.unit === 'K') {\n    const v = Math.round((b.min + Math.random() * (b.max - b.min)) / 5) * 5;\n    return `$${v}K`;\n  }\n  if (b.min < 10) {\n    const v = (b.min + Math.random() * (b.max - b.min)).toFixed(1);\n    return `$${v}M`;\n  }\n  const v = Math.round(b.min + Math.random() * (b.max - b.min));\n  return `$${v}M`;\n}\n\n// Active transfers\nconst transfers = [];\nconst arcGroup = new THREE.Group();\nglobe.add(arcGroup);\n\nfunction makeTransfer() {\n  // pick two distinct cities\n  let a = cities[Math.floor(Math.random() * cities.length)];\n  let b = cities[Math.floor(Math.random() * cities.length)];\n  let safety = 0;\n  while (b.name === a.name && safety++ < 8) b = cities[Math.floor(Math.random() * cities.length)];\n  if (a.name === b.name) return;\n\n  const pA = lonLatToVec3(a.lon, a.lat, RADIUS);\n  const pB = lonLatToVec3(b.lon, b.lat, RADIUS);\n\n  // Great-circle midpoint, lifted outward by an amount ∝ angular distance\n  const ang = pA.angleTo(pB);\n  const lift = 0.18 + Math.min(0.45, ang * 0.32);\n  const mid = pA.clone().add(pB).normalize().multiplyScalar(RADIUS + lift);\n\n  const curve = new THREE.QuadraticBezierCurve3(pA, mid, pB);\n  const SEG = 64;\n  const pts = curve.getPoints(SEG);\n\n  const arcGeom = new THREE.BufferGeometry().setFromPoints(pts);\n  const arcMat = new THREE.LineBasicMaterial({\n    color: 0x0388A6,\n    transparent: true,\n    opacity: 0.0,\n  });\n  const line = new THREE.Line(arcGeom, arcMat);\n  arcGroup.add(line);\n\n  // Traveling head (small bright dot — circular via shader)\n  const headGeom = new THREE.BufferGeometry();\n  headGeom.setAttribute('position', new THREE.Float32BufferAttribute([0,0,0], 3));\n  const headMat = new THREE.ShaderMaterial({\n    transparent: true,\n    depthWrite: false,\n    uniforms: {\n      uColor:    { value: new THREE.Color('#0388A6') },\n      uOpacity:  { value: 0.0 },\n      uSize:     { value: 9.0 },\n      uPxRatio:  { value: renderer.getPixelRatio() },\n    },\n    vertexShader: `\n      uniform float uSize;\n      uniform float uPxRatio;\n      void main() {\n        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);\n        gl_PointSize = uSize * uPxRatio;\n      }\n    `,\n    fragmentShader: `\n      uniform vec3 uColor;\n      uniform float uOpacity;\n      void main() {\n        vec2 uv = gl_PointCoord - 0.5;\n        float d = length(uv);\n        if (d > 0.5) discard;\n        // soft core + bright center\n        float core = smoothstep(0.5, 0.10, d);\n        float halo = smoothstep(0.5, 0.32, d);\n        vec3 col = mix(uColor, vec3(1.0), core * 0.55);\n        gl_FragColor = vec4(col, halo * uOpacity);\n      }\n    `\n  });\n  const head = new THREE.Points(headGeom, headMat);\n  arcGroup.add(head);\n\n  // Label\n  const labelEl = document.createElement('div');\n  labelEl.className = 'xfer';\n  const amt = pickAmount();\n  labelEl.innerHTML = `\n    <span class=\"dot\"><\u002Fspan>\n    <span class=\"amt\">${amt}<\u002Fspan>\n    <span class=\"pair\">${a.name} <span class=\"arrow\">→<\u002Fspan> ${b.name}<\u002Fspan>\n  `;\n  labelsLayer.appendChild(labelEl);\n\n  const lifetime = 4200 + Math.random() * 2400;\n  const t0 = performance.now() + Math.random() * 250;\n\n  transfers.push({\n    a, b, pA, pB, curve, line, arcMat, head, headMat, labelEl,\n    t0, lifetime,\n    revealLen: 0,\n    finished: false,\n  });\n}\n\n// Spawn cadence\nlet lastSpawn = 0;\nfunction maybeSpawn(now) {\n  // Aim for ~6-9 active transfers\n  if (transfers.length < 8 && now - lastSpawn > 380) {\n    makeTransfer();\n    lastSpawn = now;\n  }\n}\n\n// ======================================================\n// Project a 3D point to screen px (for HTML labels)\n// ======================================================\nconst _v = new THREE.Vector3();\nfunction projectToScreen(vWorld) {\n  _v.copy(vWorld).project(camera);\n  const x = (_v.x * 0.5 + 0.5) * window.innerWidth;\n  const y = (-_v.y * 0.5 + 0.5) * window.innerHeight;\n  return { x, y, z: _v.z };\n}\n\n// Determine if a point on the globe is on the front-facing\n// hemisphere (relative to camera)\nfunction isFrontFacing(worldPos) {\n  // Vector from globe center to point (in world)\n  const center = new THREE.Vector3();\n  globe.getWorldPosition(center);\n  const toPt = worldPos.clone().sub(center).normalize();\n  const toCam = camera.position.clone().sub(center).normalize();\n  return toPt.dot(toCam) > 0.05;\n}\n\n// ======================================================\n// Animate\n// ======================================================\nconst clock = new THREE.Clock();\nlet elapsed = 0;\n\nfunction animate() {\n  const dt = clock.getDelta();\n  elapsed += dt;\n\n  // Slow autorotation\n  globe.rotation.y += dt * 0.06;\n\n  const now = performance.now();\n  maybeSpawn(now);\n\n  // Update transfers\n  for (let i = transfers.length - 1; i >= 0; i--) {\n    const t = transfers[i];\n    const u = (now - t.t0) / t.lifetime;\n\n    // Phases:\n    // 0.00 – 0.10  fade in\n    // 0.10 – 0.55  draw arc forward + travel head along it\n    // 0.55 – 0.85  hold\n    // 0.85 – 1.00  fade out\n    let arcOpacity = 0;\n    let headOpacity = 0;\n    let drawT = 0;       // 0..1 how much of arc is drawn\n    let headT = 0;       // 0..1 head position along curve\n    let labelOpacity = 0;\n\n    if (u < 0) {\n      // not yet alive; keep invisible\n    } else if (u < 0.10) {\n      const k = u / 0.10;\n      arcOpacity = 0.55 * k;\n      headOpacity = 0.0;\n      labelOpacity = 0;\n    } else if (u < 0.55) {\n      const k = (u - 0.10) / 0.45;\n      drawT = k;\n      headT = k;\n      arcOpacity = 0.55;\n      headOpacity = 1.0;\n      labelOpacity = k > 0.25 ? Math.min(1, (k - 0.25) / 0.25) : 0;\n    } else if (u < 0.85) {\n      drawT = 1;\n      headT = 1;\n      arcOpacity = 0.45;\n      headOpacity = 0.9;\n      labelOpacity = 1;\n    } else if (u < 1.0) {\n      const k = (u - 0.85) / 0.15;\n      drawT = 1;\n      headT = 1;\n      arcOpacity = 0.45 * (1 - k);\n      headOpacity = 0.9 * (1 - k);\n      labelOpacity = 1 - k;\n    } else {\n      // done\n      arcGroup.remove(t.line);\n      arcGroup.remove(t.head);\n      t.line.geometry.dispose();\n      t.line.material.dispose();\n      t.head.geometry.dispose();\n      t.head.material.dispose();\n      labelsLayer.removeChild(t.labelEl);\n      transfers.splice(i, 1);\n      continue;\n    }\n\n    // Reveal arc by setting drawRange on the line geometry\n    const total = t.line.geometry.attributes.position.count;\n    const drawCount = Math.max(2, Math.floor(total * drawT));\n    t.line.geometry.setDrawRange(0, drawCount);\n    t.arcMat.opacity = arcOpacity;\n\n    // Move head\n    const headPos = t.curve.getPoint(Math.min(1, headT));\n    t.head.geometry.attributes.position.setXYZ(0, headPos.x, headPos.y, headPos.z);\n    t.head.geometry.attributes.position.needsUpdate = true;\n    t.headMat.uniforms.uOpacity.value = headOpacity;\n\n    // Position label at head (in world space, accounting for globe rotation)\n    const headWorld = headPos.clone().applyMatrix4(globe.matrixWorld);\n    const front = isFrontFacing(headWorld);\n    const screen = projectToScreen(headWorld);\n    // Offset label slightly above head\n    t.labelEl.style.left = `${screen.x}px`;\n    t.labelEl.style.top  = `${screen.y - 22}px`;\n    const visible = front && labelOpacity > 0.02;\n    t.labelEl.style.opacity = visible ? String(labelOpacity) : '0';\n  }\n\n  renderer.render(scene, camera);\n  rafId = requestAnimationFrame(animate);\n\n  // Update screen-label data for stage tag\n  const ts = Math.floor(elapsed);\n  document.getElementById('stage').setAttribute('data-screen-label', `globe ${ts}s`);\n}\n\n// ======================================================\n// Render-loop lifecycle: pause when hidden, survive\n// WebGL context loss (GPU eviction after long sessions)\n// ======================================================\nlet rafId = 0;\nfunction startLoop() {\n  cancelAnimationFrame(rafId);\n  clock.getDelta(); // swallow the big delta from the pause\n  rafId = requestAnimationFrame(animate);\n}\nfunction stopLoop() { cancelAnimationFrame(rafId); }\n\ncanvas.addEventListener('webglcontextlost', (e) => {\n  e.preventDefault(); // allow the browser to restore the context\n  stopLoop();\n});\ncanvas.addEventListener('webglcontextrestored', () => {\n  renderer.setSize(window.innerWidth, window.innerHeight);\n  startLoop();\n});\ndocument.addEventListener('visibilitychange', () => {\n  if (document.hidden) { stopLoop(); }\n  else if (!renderer.getContext().isContextLost()) { startLoop(); }\n});\nstartLoop();\n\n// ======================================================\n// Resize\n// ======================================================\nfunction onResize() {\n  renderer.setSize(window.innerWidth, window.innerHeight);\n  camera.aspect = window.innerWidth / window.innerHeight;\n  camera.updateProjectionMatrix();\n  dotMat.uniforms.uViewportH.value = window.innerHeight;\n}\nwindow.addEventListener('resize', onResize);\n\n// Pointer interaction: subtle parallax (drag-rotate without inertia for now)\nlet dragging = false, lastX = 0, lastY = 0;\ncanvas.addEventListener('pointerdown', (e) => {\n  dragging = true; lastX = e.clientX; lastY = e.clientY;\n  canvas.setPointerCapture(e.pointerId);\n});\ncanvas.addEventListener('pointermove', (e) => {\n  if (!dragging) return;\n  const dx = e.clientX - lastX, dy = e.clientY - lastY;\n  globe.rotation.y += dx * 0.005;\n  // Touch devices rotate left/right only — vertical swipes stay\n  // free for page scrolling (touch-action: pan-y on the canvas)\n  if (e.pointerType !== 'touch') {\n    globe.rotation.x += dy * 0.003;\n    globe.rotation.x = Math.max(-0.7, Math.min(0.7, globe.rotation.x));\n  }\n  lastX = e.clientX; lastY = e.clientY;\n});\nfunction endDrag(e) {\n  dragging = false;\n  try { canvas.releasePointerCapture(e.pointerId); } catch(_) {}\n}\ncanvas.addEventListener('pointerup', endDrag);\ncanvas.addEventListener('pointercancel', endDrag);\n\n// Initial seed\nfor (let i = 0; i < 4; i++) makeTransfer();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
